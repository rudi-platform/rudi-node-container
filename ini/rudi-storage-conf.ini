[server]
listening_address = 0.0.0.0
listening_port = 3031
server_url = "http://0.0.0.0:3031"
server_prefix = /media/

[auth]
system_users = {
    "admin": [ 4, "$1$1586de76f5f26e8a6dbbe05182e4dc94$", [ "admin", "delegate" ], "" ],
    "rudi_node_manager": [ 101, "/.ssh/storage_mngr.pub", [ "producer", "auth" ], "/.ssh/storage_mngr.pub" ]
 }

[database]
disabled = false
db_url = mongodb://localhost/rudi_media
db_name = rudi_media

[storage]
media_dir = /data/media
acc_timeout = 20
zones = [
    { "name":"zone_A", "staging_time":15, "destroy_time":20 },
    { "name":"zone_51" },
    { "name":"zone_bp", "path":"/data/media/bp", "csv":"list.csv", "abspath":true }
 ]

[log_server]
path = /var/log/rudi/storage
transport= 5 // TCP=1, UNIX=4
retryTimeout = 60000
rfc3164 = true

[log_local]
consoleData= false

[logging]
app_name = media-local
