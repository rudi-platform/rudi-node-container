name: rudiproducer
services:
  rudiproducer:
    image: rudinode-dc
    container_name: rudinode-dc
    restart: always
    ports:
      - 3030:3030
      - 3031:3031
      - 3032:3032
    volumes:
      - ./data:/data:rw
    environment:
      NODE_PUBLIC_URL: http://localhost
      ENABLE_DB: true
      ENABLE_CATALOG: true
      ENABLE_STORAGE: true
      ENABLE_MANAGER: true
    network_mode: host
